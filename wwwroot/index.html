<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XOA Backup Monitor</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <header class="header">
    <div class="header-left">
      <h1>XOA Backup Monitor <span class="badge">Web</span></h1>
      <div class="overall-row">
        <span>Overall Status:</span>
        <span id="overallStatus" class="status-pill">Loading...</span>
      </div>
      <div id="summaryText" class="summary-text">-</div>
    </div>
    <div class="header-right">
      <button id="collapseAllBtn" class="icon-only-btn" title="Collapse/expand all instances">&#9660;</button>
      <button id="themeToggleBtn">Dark</button>
      <button id="viewToggleBtn">Switch to Table View</button>
      <button id="refreshBtn">Refresh Now</button>
      <button id="exportBtn">Export CSV</button>
      <button id="configureBtn">Configure</button>
    </div>
  </header>

  <main id="groupedView" class="groups"></main>

  <main id="tableView" class="table-view hidden">
    <div id="instancePills" class="instance-pills"></div>
    <table id="allVmsTable" class="sortable-table">
      <thead>
        <tr>
          <th data-key="statusDot" class="col-dot"></th>
          <th data-key="instanceName">Instance</th>
          <th data-key="vmName">VM Name</th>
          <th data-key="statusText">Status</th>
          <th data-key="formattedLastBackup">Last Backup</th>
          <th data-key="ageInHours">Hours Ago</th>
          <th data-key="message">Message</th>
        </tr>
      </thead>
      <tbody id="allVmsTableBody"></tbody>
    </table>
  </main>

  <footer class="footer">
    <span id="lastRefreshText">Not refreshed yet</span>
    <span id="totalVmCount">Total VMs: 0</span>
  </footer>

  <div id="configModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configuration</h2>
        <button id="closeConfigBtn" class="close-btn">&times;</button>
      </div>

      <section>
        <h3>Global Settings</h3>
        <label>
          Refresh Interval (minutes):
          <input type="number" id="refreshIntervalInput" min="1" value="30" />
        </label>
        <label>
          Max Concurrent Requests (per instance):
          <input type="number" id="maxConcurrentRequestsInput" min="1" value="12" />
        </label>
        <label>
          Max Concurrent Instance Refreshes:
          <input type="number" id="maxConcurrentInstanceRefreshesInput" min="1" value="5" />
        </label>
        <button id="saveIntervalBtn">Save Settings</button>
      </section>

      <section>
        <h3>XOA Instances</h3>
        <table id="instanceTable">
          <thead>
            <tr><th>Name</th><th>URL</th><th>Enabled</th><th>Token Set</th><th></th></tr>
          </thead>
          <tbody id="instanceTableBody"></tbody>
        </table>
      </section>

      <section>
        <h3 id="instanceFormTitle">Add / Update Instance</h3>
        <form id="instanceForm">
          <input type="hidden" id="instanceId" value="" />
          <label>Name <input type="text" id="instanceName" required /></label>
          <label>URL <input type="text" id="instanceUrl" placeholder="https://xoa.example.com" required /></label>
          <label>API Token <input type="password" id="instanceToken" placeholder="Leave blank to keep existing" /></label>
          <label class="checkbox-label"><input type="checkbox" id="instanceEnabled" checked /> Enabled</label>
          <div class="form-actions">
            <button type="submit" id="saveInstanceBtn">Save Instance</button>
            <button type="button" id="testConnectionBtn">Test Connection</button>
            <button type="button" id="cancelEditBtn" class="hidden">Cancel Edit / New Instance</button>
          </div>
          <div id="testResult"></div>
        </form>
      </section>
    </div>
  </div>

  <div id="historyModal" class="modal hidden">
    <div class="modal-content history-modal-content">
      <div class="modal-header">
        <h2 id="historyTitle">VM Backup History</h2>
        <button id="closeHistoryBtn" class="close-btn">&times;</button>
      </div>

      <div class="history-filters">
        <label>Time Range
          <select id="historyRangeFilter">
            <option value="7">Last 7 Days</option>
            <option value="30" selected>Last 30 Days</option>
            <option value="90">Last 90 Days</option>
            <option value="0">All Time</option>
          </select>
        </label>
        <label>Status
          <select id="historyStatusFilter">
            <option value="all">All Statuses</option>
            <option value="Success">Success Only</option>
            <option value="Warning">Warnings Only</option>
            <option value="Failed">Failures Only</option>
          </select>
        </label>
      </div>

      <div id="historyStats" class="history-stats"></div>

      <div id="historyBody">
        <table id="historyTable">
          <thead>
            <tr><th>Snapshot Time</th><th>Status</th><th>Message</th></tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
